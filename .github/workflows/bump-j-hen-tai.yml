name: Bump JHenTai cask

on:
  schedule:
    - cron: "37 19 * * *" # 每天 19:37 UTC 运行一次
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump cask file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bump-j-hen-tai.sh

      - name: Check diff
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          version="$(ruby -e 'print File.read("Casks/j-hen-tai.rb")[/version\s+\"([^\"]+)\"/, 1]')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/j-hen-tai.rb
          git commit -m "cask(j-hen-tai): bump to v${version}"
          git push
